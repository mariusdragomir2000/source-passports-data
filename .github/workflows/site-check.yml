name: Check how the live passports page answers filters
# Runs only by hand. Follows the "See all passports" link and the search box on the
# About page, then checks whether the page it reaches filters by country. Changes nothing.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check
        run: |
          UA="source-passports-check/1.0"
          for start in "https://mpmonitor.org/about-passports/" "https://mpmonitor.org/passports/"; do
            echo "=== start $start"
            curl -sSL -A "$UA" -o start.html -w "status %{http_code} final %{url_effective}\n" "$start" || true
            python3 - <<'PY'
          import re, html
          s = open('start.html', encoding='utf-8', errors='ignore').read()
          print('see-all links:', sorted(set(html.unescape(h) for h in re.findall(r'class="mpmp-findbox-all"><a href="([^"]+)"', s))))
          print('form actions:', sorted(set(html.unescape(h) for h in re.findall(r'<form class="mpmp-find"[^>]*action="([^"]+)"', s))))
          open('targets.txt', 'w').write('\n'.join(sorted(set(html.unescape(h) for h in re.findall(r'class="mpmp-findbox-all"><a href="([^"]+)"', s) + re.findall(r'<form class="mpmp-find"[^>]*action="([^"]+)"', s)))))
          PY
            while read -r t; do
              [ -z "$t" ] && continue
              for q in "" "?mpmp_country=RO" "?mpmp_q=adevarul"; do
                u="${t}${q}"
                echo "--- $u"
                curl -sSL -A "$UA" -o t.html -w "status %{http_code} final %{url_effective}\n" "$u" || true
                python3 -c "import re,html;s=open('t.html',encoding='utf-8',errors='ignore').read();i=s.find('id=\"mpmp-results-title\"');t=re.sub('<[^>]+>',' ',s[i:i+400]);print('  results:',' '.join(html.unescape(t).split())[:120] if i>=0 else 'NO RESULTS HEADING');print('  hub present:', 'mpmp-hub' in s, '| browse panel:', 'mpmp-browse' in s, '| body classes:', (re.findall(r'<body[^>]*class=\"([^\"]+)\"',s) or [''])[0][:160]);print('  title:', (re.findall(r'<title>([^<]+)',s) or [''])[0][:80]);print('  cache:', re.findall(r'<!-- Page cached by[^>]*-->',s)[:1])"
              done
            done < targets.txt
          done
