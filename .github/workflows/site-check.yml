name: Check how the live passports page answers filters
# Runs only by hand. Prints the outline of the live passports page with and without
# a filter (headings, number of passport cards, page title, layout classes). Changes nothing.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check
        run: |
          for u in "https://mpmonitor.org/passports/" "https://mpmonitor.org/passports/?mpmp_kind=media" "https://mpmonitor.org/passports/?mpmp_country=RO&x=$RANDOM" "https://mpmonitor.org/passports/?mpmp_q=adevarul"; do
            echo "=== $u"
            curl -sSL -A "source-passports-check/1.0" -o t.html -w "status %{http_code} final %{url_effective} bytes %{size_download}\n" "$u" || true
            python3 -c "
          import re,html
          s=open('t.html',encoding='utf-8',errors='ignore').read()
          b=(re.findall(r'<body[^>]*class=\"([^\"]+)\"',s) or [''])[0]
          print('body:',b[:220])
          print('passport cards:',s.count('<li class=\"mpmp-card\"'),'| hub blocks:',s.count('class=\"mpmp mpmp-hub'),'| other lists:',len(re.findall(r'<table',s)),'tables')
          for m in re.finditer(r'<h([1-3])[^>]*>(.*?)</h\1>',s,re.S):
              t=' '.join(html.unescape(re.sub('<[^>]+>',' ',m.group(2))).split())
              if t: print('  h%s: %s'%(m.group(1),t[:110]))
          "
          done
