name: Mirror the daily open-data snapshot
# Continuity safeguard: keeps a copy of the whole public register outside the
# web server. Runs daily; commits only when the file changed.
on:
  schedule:
    - cron: "40 4 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Download the snapshot
        run: |
          mkdir -p mirror
          # Short connection timeout and several spaced retries: if the site is
          # slow or briefly unreachable, try again a few minutes later instead
          # of waiting on one connection for a quarter of an hour.
          curl -fsSL --create-dirs \
            --connect-timeout 30 --max-time 300 \
            --retry 5 --retry-delay 60 --retry-all-errors \
            -A "source-passports-mirror/1.0 (+https://github.com/mariusdragomir2000/source-passports-data)" \
            -o mirror/passports-latest.json.new \
            "https://mpmonitor.org/wp-content/uploads/passport-open-data/passports-latest.json"
          # Keep the previous copy unless the new one is a valid snapshot.
          python3 -c "import json;d=json.load(open('mirror/passports-latest.json.new'));assert d['register']['generated'];print('Snapshot', d['register']['generated'], 'passports:', d.get('count'))"
          # Stored compressed: the full register is tens of megabytes as plain
          # JSON, a few as .gz (GitHub warns above 50 MB per file).
          gzip -9nc mirror/passports-latest.json.new > mirror/passports-latest.json.gz
          rm mirror/passports-latest.json.new
      - name: Commit if changed
        run: |
          git config user.name "snapshot-mirror"
          git config user.email "actions@users.noreply.github.com"
          git rm -q --cached --ignore-unmatch mirror/passports-latest.json
          rm -f mirror/passports-latest.json
          git add mirror/passports-latest.json.gz
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -m "Snapshot $(date -u +%F)"
            git push
          fi
